[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[project]
name = "kaos-llm-core"
dynamic = ["version"]
description = "LLM programming primitives — typed, composable, optimizable LLM functions for KAOS"
readme = "README.md"
requires-python = ">=3.13"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [
  { name = "273 Ventures LLC", email = "it@273ventures.com" },
]
maintainers = [
  { name = "Michael Bommarito", email = "mike@273ventures.com" },
]
keywords = [
  "llm",
  "dspy",
  "signatures",
  "programs",
  "optimizers",
  "mcp",
  "agentic",
  "kaos",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: Implementation :: CPython",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Scientific/Engineering :: Information Analysis",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Typing :: Typed",
]
dependencies = [
  "kaos-content>=0.1.0a1,<0.2",
  "kaos-core>=0.1.0a3,<0.2",
  "kaos-llm-client>=0.1.0a2,<0.2",
  "kaos-nlp-core>=0.1.0a2,<0.2",
  "pydantic>=2.11.0",
]

# NOTE: the [mcp], [pdf], and [tabular] extras are not declared at 0.1.0a1
# because the underlying kaos-mcp, kaos-pdf, and kaos-tabular packages are
# not yet on PyPI. ``uv lock`` is strict and refuses to resolve any declared
# extra whose package is not resolvable. These extras (cross-module input
# bridges for the batch runner) will be re-added in 0.1.0a2 once those
# siblings ship. Until then, install those packages from source.
[project.optional-dependencies]
# OpenTelemetry instrumentation — emits LLM-call spans through the
# `opentelemetry-api` no-op tracer when no provider SDK is installed,
# and through any user-configured exporter when one is.
otel = [
  "opentelemetry-api>=1.20",
]

[project.scripts]
kaos-llm-core = "kaos_llm_core.cli:main"
kaos-llm-core-serve = "kaos_llm_core.serve:main"

[project.urls]
Homepage = "https://kelvin.legal"
Documentation = "https://docs.kelvin.legal"
Repository = "https://github.com/273v/kaos-llm-core"
Issues = "https://github.com/273v/kaos-llm-core/issues"
Changelog = "https://github.com/273v/kaos-llm-core/blob/main/CHANGELOG.md"

[dependency-groups]
dev = [
  "pytest>=9.0.3",
  "pytest-asyncio>=1.3.0",
  "pytest-cov>=7.1.0",
  "ruff>=0.15.12",
  "ty>=0.0.34,<0.1",
]

[tool.hatch.version]
path = "kaos_llm_core/_version.py"

[tool.hatch.build.targets.sdist]
include = [
  "/kaos_llm_core",
  "/tests/unit",
  "/README.md",
  "/CHANGELOG.md",
  "/LICENSE",
  "/NOTICE",
  "/SECURITY.md",
  "/pyproject.toml",
]

[tool.hatch.build.targets.wheel]
packages = ["kaos_llm_core"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = [
  "-ra",
  "--strict-markers",
  "--strict-config",
  "--cov=kaos_llm_core",
  "--cov-branch",
  "--cov-report=term-missing",
]
markers = [
  "integration: end-to-end behavior checks requiring API credentials",
  "unit: focused unit checks",
]

[tool.coverage.run]
source = ["kaos_llm_core"]
branch = true
omit = [
  "*/tests/*",
]

[tool.coverage.report]
show_missing = true
skip_covered = false
exclude_lines = [
  "pragma: no cover",
  "if TYPE_CHECKING:",
  "@abstractmethod",
]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF", "C4", "PTH"]

[tool.ruff.lint.isort]
known-first-party = ["kaos_llm_core"]

[tool.ty.src]
include = ["kaos_llm_core", "tests"]
# Test files that import siblings stripped from the per-module repo's
# dev group at 0.1.0a1 (kaos-mcp, kaos-pdf, kaos-tabular, kaos-office,
# kaos-web, kaos-source). The runtime imports are gated behind
# pytest.importorskip / try-import-ImportError but ty resolves modules
# statically. Re-include once the sibling extras come back at 0.1.0a2.
exclude = [
    "tests/unit/test_graph.py",
    "tests/integration/conftest.py",
    "tests/integration/run_verification_diagnostics.py",
    "tests/integration/test_batch_mcp_wire.py",
    "tests/integration/test_multiformat_extraction.py",
    "tests/integration/test_multiformat_smoke.py",
    "tests/integration/test_phase6_mcp_wire.py",
    "tests/integration/test_phase7_mcp_wire.py",
    "tests/integration/test_phase15_mcp_wire.py",
    "tests/integration/test_rag_ecfr_scale.py",
    "tests/integration/test_rag_ecfr_tax.py",
    "tests/integration/test_rag_edgar_10k.py",
    "tests/integration/test_rag_federal_register.py",
]

[tool.uv]
package = true
